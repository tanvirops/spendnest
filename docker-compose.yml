version: '3.8'
services:
  server:
    build:
      context: ./server
      args:
        - MONGO_URI=${MONGO_URI}
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
    env_file: .env
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
