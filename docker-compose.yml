version: '3.8'
services:
  mongodb:
    image: mongo:8
    container_name: expense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      args:
        - MONGO_URI=${MONGO_URI}
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/expense_tracker
    ports:
      - "3042:3042"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
    env_file: .env
    ports:
      - "3041:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
