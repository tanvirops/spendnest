services:
  mongodb:
    image: mongo:8
    container_name: expense-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  server:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/spendnest-server:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/expense_tracker}
      NODE_ENV: production
      PORT: 5000
    ports:
      - '3042:5000'
    restart: unless-stopped

  client:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/spendnest-client:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - '3041:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
