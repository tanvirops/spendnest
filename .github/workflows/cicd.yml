name: CI/CD pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Set to "true" to build Docker images when manually triggering workflow'
        required: false
        default: 'false'

jobs:
  test-client:
    name: Test & Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install client deps
        working-directory: ./client
        run: npm install
      - name: Run client tests
        working-directory: ./client
        run: npm test --if-present
      - name: Build client
        working-directory: ./client
        run: npm run build --if-present

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install server deps
        working-directory: ./server
        run: npm ci
      - name: Run server tests
        working-directory: ./server
        run: npm test --if-present
  Deploy:
    runs-on: self-hosted
    needs: [test-client, test-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Sync Project 
        run: |
          pwd
          cd ${{vars.LOTTIEICON_WORKSPACE}}
          whoami
          hostname
          pwd
          ls -la
      - name: Build Docker Images
        working-directory: ${{vars.LOTTIEICON_WORKSPACE}}
        run: |
          set -e
          echo "Building Docker images..."
          docker compose down || true
          docker compose build
          docker compose up -d
          docker ps grep expense-*
          echo "Docker images built and containers started successfully."
