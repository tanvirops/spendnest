name: CI/CD pipeline
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  test-client:
    name: Test & Build Client
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
      - name: Install client deps
        working-directory: ./client
        run: npm ci
      - name: Run client tests
        working-directory: ./client
        run: npm test --if-present
      - name: Build client
        working-directory: ./client
        run: npm run build --if-present

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
      - name: Install server deps
        working-directory: ./server
        run: npm ci
      - name: Run server tests
        working-directory: ./server
        run: npm test --if-present

  Deploy:
    runs-on: self-hosted
    needs: [test-client, test-server]
    if: ${{ github.event.pull_request.merged == true }}
    env:
      SHINE32_PASSWORD: ${{ secrets.SHINE32_PASSWORD }}
      EXPENSE_TRACKER_DIR: ${{ vars.EXPENSE_TRACKER_DIR }}
      EXPENSE_TRACKER_DOMAIN: ${{ vars.EXPENSE_TRACKER_DOMAIN }}
      EXPENSE_CLOUDFLARE_CERT: ${{ vars.EXPENSE_TANVIR_CLOUDFLARE_CERTIFICATE }}
      EXPENSE_CLOUDFLARE_KEY: ${{ vars.EXPENSE_TANVIR_CLOUDFLARE_PRIVATE_KEY }}
    steps:
      - name: Check App Directory Exist Or Not
        run: |
          if [ ! -d "$EXPENSE_TRACKER_DIR" ]; then
            echo "Directory $EXPENSE_TRACKER_DIR does not exist. Creating it..."
            echo "$SHINE32_PASSWORD" | sudo -S mkdir -p "$EXPENSE_TRACKER_DIR"
            echo "$SHINE32_PASSWORD" | sudo -S chown -R shine32:shine32 "$EXPENSE_TRACKER_DIR"
            cd "$EXPENSE_TRACKER_DIR"
            git clone git@github.com:Tanvir-Alam625/expense-tracker.git .
          else
            echo "Directory $EXPENSE_TRACKER_DIR already exists."
            cd "$EXPENSE_TRACKER_DIR"
            git pull origin main
          fi

      - name: Deploy Configuration
        working-directory: ${{ vars.EXPENSE_TRACKER_DIR }}
        run: |
          pwd
          echo "$EXPENSE_TRACKER_DIR"
          rm -f deploy.sh
          cp example.deploy.sh deploy.sh
          chmod +x deploy.sh
          ./deploy.sh
