name: CI/CD pipeline
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test-client:
    name: Test & Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
      - name: Install client deps
        working-directory: ./client
        run: npm ci
      - name: Run client tests
        working-directory: ./client
        run: npm test --if-present
      - name: Build client
        working-directory: ./client
        run: npm run build --if-present

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
      - name: Install server deps
        working-directory: ./server
        run: npm ci
      - name: Run server tests
        working-directory: ./server
        run: npm test --if-present

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [test-client, test-server]
    permissions:
      contents: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_CLIENT_REPOSITORY: ${{ vars.DOCKERHUB_CLIENT_REPOSITORY || 'spendnest-client' }}
      DOCKERHUB_SERVER_REPOSITORY: ${{ vars.DOCKERHUB_SERVER_REPOSITORY || 'spendnest-server' }}
      VITE_API_URL: ${{ vars.EXPENSE_TRACKER_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_NAMESPACE" || { echo "Repository variable DOCKERHUB_NAMESPACE is required." >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "Repository secret DOCKERHUB_USERNAME is required." >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Repository secret DOCKERHUB_TOKEN is required." >&2; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract client image metadata
        id: meta_client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_CLIENT_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_tag}}

      - name: Extract server image metadata
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_SERVER_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_tag}}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta_client.outputs.tags }}
          labels: ${{ steps.meta_client.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Deploy:
    runs-on: self-hosted
    needs: [publish-images]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      SHINE32_PASSWORD: ${{ secrets.SHINE32_PASSWORD }}
      EXPENSE_TRACKER_DIR: ${{ vars.EXPENSE_TRACKER_DIR }}
      EXPENSE_TRACKER_DOMAIN: ${{ vars.EXPENSE_TRACKER_DOMAIN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      IMAGE_TAG: sha-${{ github.sha }}
      CLOUDFLARE_CERT: ${{ vars.EXPENSE_TANVIR_CLOUDFLARE_CERTIFICATE }}
      CLOUDFLARE_KEY: ${{ vars.EXPENSE_TANVIR_CLOUDFLARE_PRIVATE_KEY }}
    steps:
      - name: Check App Directory Exist Or Not
        run: |
          if [ ! -d "$EXPENSE_TRACKER_DIR" ]; then
            echo "Directory $EXPENSE_TRACKER_DIR does not exist. Creating it..."
            echo "$SHINE32_PASSWORD" | sudo -S mkdir -p "$EXPENSE_TRACKER_DIR"
            echo "$SHINE32_PASSWORD" | sudo -S chown -R shine32:shine32 "$EXPENSE_TRACKER_DIR"
            cd "$EXPENSE_TRACKER_DIR"
            git clone git@github.com:Tanvir-Alam625/expense-tracker.git .
          else
            echo "Directory $EXPENSE_TRACKER_DIR already exists."
            cd "$EXPENSE_TRACKER_DIR"
            git fetch --prune origin main
            git reset --hard origin/main
          fi

      - name: Deploy Configuration
        working-directory: ${{ vars.EXPENSE_TRACKER_DIR }}
        run: |
          pwd
          echo "$EXPENSE_TRACKER_DIR"
          export DOCKERHUB_NAMESPACE IMAGE_TAG
          rm -f deploy.sh
          cp example.deploy.sh deploy.sh
          chmod +x deploy.sh
          ./deploy.sh
