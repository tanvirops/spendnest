name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Set to "true" to build Docker images when manually triggering workflow'
        required: false
        default: 'false'

jobs:
  test-client:
    name: Test & Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install client deps
        working-directory: ./client
        run: npm install
      - name: Run client tests
        working-directory: ./client
        run: npm test --if-present
      - name: Build client
        working-directory: ./client
        run: npm run build --if-present

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install server deps
        working-directory: ./server
        run: npm ci
      - name: Run server tests
        working-directory: ./server
        run: npm test --if-present

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [ test-client, test-server ]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_images == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Load repo env
        run: |
          if [ -f .env ]; then export $(grep -v '^#' .env | xargs); fi
      - name: Build client image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          tags: expense-tracker-client:latest
          push: false
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
      - name: Build server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          tags: expense-tracker-server:latest
          push: false
          build-args: |
            MONGO_URI=${{ secrets.MONGO_URI }}
